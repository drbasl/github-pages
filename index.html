<body class="dark">
    <div class="theme-toggle" id="themeToggle"><span id="themeIcon">🌙</span></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 🚀 محرك التوليد الذكي - يعمل بدون إنترنت!
        const PromptGenerator = {
            // قوالب التحسين الاحترافية
            enhancementTemplates: {
                structure: [
                    "قم بصياغة برومبت احترافي يتضمن",
                    "صمم طلب مفصل ومنظم يحتوي على",
                    "أنشئ برومبت شامل يشمل",
                    "اكتب تعليمات واضحة تتضمن"
                ],
                elements: [
                    "مقدمة توضح الهدف بشكل دقيق",
                    "تفاصيل محددة عن المخرجات المطلوبة",
                    "السياق والخلفية اللازمة",
                    "معايير الجودة والمتطلبات",
                    "أمثلة توضيحية إن أمكن",
                    "نبرة وأسلوب الكتابة المطلوب",
                    "القيود أو المحاذير المهمة",
                    "تنسيق النتيجة النهائية"
                ],
                enhancements: [
                    "استخدم لغة واضحة ومباشرة",
                    "حدد المتغيرات بين أقواس مربعة [متغير]",
                    "أضف تفاصيل كافية دون إطالة",
                    "نظم المتطلبات في نقاط أو أقسام",
                    "حدد الطول أو الحجم المتوقع للنتيجة",
                    "اذكر الجمهور المستهدف",
                    "حدد الهدف النهائي من المحتوى"
                ],
                contextAdditions: [
                    "مع مراعاة الثقافة السعودية",
                    "بأسلوب عصري وجذاب",
                    "مناسب للمنصات الرقمية",
                    "يحقق أعلى نسبة تفاعل",
                    "بصياغة احترافية",
                    "مع أمثلة عملية",
                    "بطريقة سهلة الفهم"
                ],
                qualityMarkers: [
                    "تأكد من",
                    "احرص على",
                    "لا تنسَ",
                    "من المهم",
                    "يُفضل"
                ]
            },

            // دالة التوليد الرئيسية
            generate(basicPrompt) {
                if (!basicPrompt || basicPrompt.trim().length < 5) {
                    return "⚠️ الرجاء إدخال نص أطول للحصول على نتائج أفضل";
                }

                const prompt = basicPrompt.trim();
                
                // تحليل البرومبت لتحديد النوع
                const promptType = this.analyzePromptType(prompt);
                
                // توليد برومبت محسّن
                const enhanced = this.buildEnhancedPrompt(prompt, promptType);
                
                return enhanced;
            },

            // تحليل نوع البرومبت
            analyzePromptType(prompt) {
                const lower = prompt.toLowerCase();
                
                if (lower.includes('مقال') || lower.includes('كتاب') || lower.includes('تدوين')) {
                    return 'article';
                } else if (lower.includes('تويتر') || lower.includes('تغريد') || lower.includes('سوشيال')) {
                    return 'social';
                } else if (lower.includes('كود') || lower.includes('برمج') || lower.includes('سكربت')) {
                    return 'code';
                } else if (lower.includes('تصميم') || lower.includes('صورة') || lower.includes('رسم')) {
                    return 'design';
                } else if (lower.includes('شرح') || lower.includes('تعليم') || lower.includes('درس')) {
                    return 'educational';
                } else if (lower.includes('تسويق') || lower.includes('إعلان') || lower.includes('منتج')) {
                    return 'marketing';
                }
                
                return 'general';
            },

            // بناء البرومبت المحسّن
            buildEnhancedPrompt(originalPrompt, type) {
                const templates = this.enhancementTemplates;
                
                // اختيار عناصر عشوائية
                const structure = this.getRandom(templates.structure);
                const elements = this.getRandomMultiple(templates.elements, 4);
                const enhancements = this.getRandomMultiple(templates.enhancements, 3);
                const context = this.getRandom(templates.contextAdditions);
                const qualityMarker = this.getRandom(templates.qualityMarkers);
                
                // بناء البرومبت حسب النوع
                let enhanced = `${structure}:\n\n`;
                enhanced += `📋 **الطلب الأساسي:**\n${originalPrompt}\n\n`;
                enhanced += `✨ **المتطلبات التفصيلية:**\n`;
                
                elements.forEach((element, index) => {
                    enhanced += `${index + 1}. ${element}\n`;
                });
                
                enhanced += `\n🎯 **معايير الجودة:**\n`;
                enhancements.forEach((enhancement, index) => {
                    enhanced += `• ${enhancement}\n`;
                });
                
                enhanced += `\n💡 **ملاحظات إضافية:**\n`;
                enhanced += `${qualityMarker} ${context}.\n`;
                
                // إضافة نصائح خاصة بالنوع
                enhanced += this.getTypeSpecificTips(type);
                
                return enhanced;
            },

            // نصائح خاصة بكل نوع
            getTypeSpecificTips(type) {
                const tips = {
                    article: "\n📝 **للمقالات:**\n• استخدم عناوين فرعية واضحة\n• أضف مقدمة جذابة وخاتمة قوية\n• استخدم أمثلة وإحصائيات\n",
                    social: "\n📱 **للسوشيال ميديا:**\n• اجعله قصيراً وجذاباً\n• استخدم الإيموجي بذكاء\n• أضف Call to Action واضح\n",
                    code: "\n💻 **للبرمجة:**\n• اذكر لغة البرمجة المطلوبة\n• حدد المدخلات والمخرجات\n• اطلب تعليقات توضيحية في الكود\n",
                    design: "\n🎨 **للتصميم:**\n• حدد الألوان والأبعاد\n• اذكر الأسلوب المطلوب (مينيمال، عصري، كلاسيكي)\n• حدد الاستخدام النهائي\n",
                    educational: "\n📚 **للمحتوى التعليمي:**\n• حدد المستوى الدراسي أو العمري\n• استخدم أسلوب بسيط ومباشر\n• أضف أمثلة عملية\n",
                    marketing: "\n🎯 **للتسويق:**\n• حدد الجمهور المستهدف\n• اذكر نقاط البيع الرئيسية\n• استخدم لغة مقنعة وجذابة\n",
                    general: "\n✅ **نصائح عامة:**\n• كن محدداً قدر الإمكان\n• استخدم أمثلة لتوضيح المطلوب\n• حدد الطول أو الحجم المتوقع\n"
                };
                
                return tips[type] || tips.general;
            },

            // دوال مساعدة
            getRandom(array) {
                return array[Math.floor(Math.random() * array.length)];
            },

            getRandomMultiple(array, count) {
                const shuffled = [...array].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, count);
            }
        };

        // بيانات الأسئلة الشائعة
        const faqData = [
            {
                question: "ما هو البرومبت (Prompt)؟",
                answer: "البرومبت هو الطلب أو التعليمات التي تعطيها لنموذج الذكاء الاصطناعي للحصول على نتيجة أو محتوى مطلوب. يمكن اعتباره كـ 'السؤال' أو 'المهمة' التي تطلبها من الذكاء الاصطناعي.",
                icon: "🤖"
            },
            {
                question: "كيف أكتب برومبت فعال؟",
                answer: "لكتابة برومبت فعال اتبع هذه الخطوات:\n• حدد الهدف بوضوح\n• استخدم لغة بسيطة ودقيقة\n• وجه النموذج لنبرة أو أسلوب معين\n• حدد صيغة المخرجات المطلوبة (نقاط، مقال، تغريدة، كود)\n• أضف سياق كافي للموضوع",
                icon: "✍️"
            },
            {
                question: "هل يحتاج البرومبت إلى ذكر تفاصيل كثيرة؟",
                answer: "كلما زادت التفاصيل الدقيقة زادت جودة النتائج، لكن تجنب الإطالة غير الضرورية. التوازن هو المفتاح - أضف تفاصيل مهمة واحذف التكرار والحشو.",
                icon: "📝"
            },
            {
                question: "كيف أوجه البرومبت لنبرة محددة؟",
                answer: "أضف عبارات مثل:\n• 'استخدم نبرة رسمية واحترافية'\n• 'اجعل الأسلوب مرحاً وجذاباً'\n• 'اكتب بأسلوب تحفيزي وملهم'\n• 'استخدم لغة بسيطة مناسبة للمبتدئين'\n\nهذا يضبط طريقة كتابة الذكاء الاصطناعي للمحتوى.",
                icon: "🎭"
            },
            {
                question: "ما الفرق بين البرومبت الجيد والسيء؟",
                answer: "البرومبت الجيد: واضح، محدد، يحتوي على سياق كافي، ويحدد الصيغة المطلوبة.\n\nمثال سيء: 'اكتب عن التسويق'\n\nمثال جيد: 'اكتب مقال 500 كلمة عن استراتيجيات التسويق الرقمي للشركات الصغيرة في 2025، مع التركيز على السوشيال ميديا، بأسلوب عملي يحتوي على أمثلة'",
                icon: "⚖️"
            }
        ];
        // البرومبتات الشائعة
        const popularPrompts = [
            {
                rank: 1,
                prompt: "اكتب 5 نصائح للمذاكرة الفعالة بأسلوب بسيط ومحفز",
                rating: 5,
                category: "تعليمي",
                uses: 2847
            },

                                            <div
                                                key={item.id}
                                                onClick={() => setSelectedPrompt({...item, fullPrompt: item.basePrompt})}
                                                className="library-card card-bg p-5 rounded-2xl"
                                            >
                                                <h3 className="font-bold text-primary mb-2">{item.title}</h3>
                                                <p className="text-secondary text-xs mb-3">{item.description}</p>
                                                <div className="flex justify-between items-center">
                                                    <span className="category-badge text-xs" style={{background: 'rgba(0, 212, 170, 0.2)', color: '#00d4aa'}}>
                                                        {item.category}
                                                    </span>
                                                    <span className={`quality-indicator ${item.quality === 'pro' ? 'quality-pro' : 'quality-advanced'}`}>
                                                        <i className="fas fa-star"></i>
                                                        {item.quality === 'pro' ? t.proQuality : t.advancedQuality}
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {/* Optimizer Tab */}
                        {activeTab === 'optimizer' && (
                            <div className="animate-fade-in">
                                <div className="card-bg p-8 rounded-3xl glow-effect">
                                    <h2 className="text-2xl font-bold text-primary mb-6">📊 محلل البرومبتات الذكي</h2>
                                    
                                    {!showOptimizer ? (
                                        <div className="text-center py-12">
                                            <div className="text-6xl mb-4">🔍</div>
                                            <p className="text-xl text-secondary mb-6">قم بإدخال برومبت في تبويب "المولد" واضغط على "📊"</p>
                                            <button
                                                onClick={() => setActiveTab('generator')}
                                                className="gradient-btn px-8 py-3 rounded-xl"
                                            >
                                                اذهب إلى المولد
                                            </button>
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="text-center mb-8">
                                                <div className="optimizer-score mb-4">{optimizerScore}%</div>
                                                <div className="score-bar">
                                                    <div className="score-fill" style={{width: `${optimizerScore}%`}}></div>
                                                </div>
                                                <p className="text-secondary mt-2">
                                                    {optimizerScore >= 80 ? '🎉 ممتاز! برومبت قوي جداً' :
                                                     optimizerScore >= 60 ? '👍 جيد! يمكن تحسينه أكثر' :
                                                     optimizerScore >= 40 ? '⚠️ متوسط، يحتاج تحسينات' :
                                                     '❌ ضعيف، اتبع الاقتراحات'}
                                                </p>
                                            </div>

                                            {optimizerSuggestions.length > 0 && (
                                                <div>
                                                    <h3 className="text-xl font-bold text-primary mb-4">💡 اقتراحات التحسين</h3>
                                                    {optimizerSuggestions.map((suggestion, index) => (
                                                        <div
                                                            key={index}
                                                            className="suggestion-item input-bg"
                                                            style={{
                                                                borderLeftColor: 
                                                                    suggestion.type === 'success' ? '#00d4aa' :
                                                                    suggestion.type === 'warning' ? '#ffd93d' :
                                                                    '#ff6b6b'
                                                            }}
                                                        >
                                                            <p className="text-primary">
                                                                {suggestion.type === 'success' ? '✅' :
                                                                 suggestion.type === 'warning' ? '⚠️' :
                                                                 '💡'} {suggestion.text}
                                                            </p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Industries Tab */}
                        {activeTab === 'industries' && (
                            <div className="animate-fade-in">
                                <div className="card-bg p-8 rounded-3xl">
                                    <h2 className="text-2xl font-bold text-primary mb-6">🏭 {t.selectIndustry}</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                        {Object.entries(industryTemplates).map(([key, industry]) => (
                                            <div
                                                key={key}
                                                onClick={() => setSelectedIndustry(selectedIndustry === key ? null : key)}
                                                className={`industry-card card-bg p-6 rounded-2xl text-center cursor-pointer ${
                                                    selectedIndustry === key ? 'selected' : ''
                                                }`}
                                            >
                                                <div className="text-5xl mb-3">{industry.icon}</div>
                                                <h3 className="font-bold text-primary">{industry.name}</h3>
                                            </div>
                                        ))}
                                    </div>

                                    {selectedIndustry && (
                                        <div className="animate-fade-in">
                                            <h3 className="text-xl font-bold text-primary mb-4">
                                                قوالب {industryTemplates[selectedIndustry].name}
                                            </h3>
                                            <div className="grid gap-3">
                                                {industryTemplates[selectedIndustry].prompts.map((prompt, index) => (
                                                    <div
                                                        key={index}
                                                        onClick={() => {
                                                            setBasicPrompt(prompt);
                                                            setActiveTab('generator');
                                                        }}
                                                        className="input-bg p-4 rounded-xl cursor-pointer hover:bg-opacity-80 transition-all"
                                                    >
                                                        <p className="text-primary">📝 {prompt}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* FAQ Tab */}
                        {activeTab === 'faq' && (
                            <div className="animate-fade-in">
                                <div className="card-bg p-8 rounded-3xl">
                                    <h2 className="text-3xl font-bold text-primary mb-4">❓ أسئلة شائعة عن البرومبتات</h2>
                                    <p className="text-secondary mb-8">دليل شامل للمبتدئين لفهم وكتابة برومبتات فعالة</p>
                                    
                                    <div className="mb-12">
                                        {faqData.map((faq, index) => (
                                            <div key={index} className="faq-item input-bg">
                                                <div 
                                                    className="faq-question"
                                                    onClick={() => toggleFaq(index)}
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-3xl">{faq.icon}</span>
                                                        <span className="text-primary">{faq.question}</span>
                                                    </div>
                                                    <span className={`faq-icon ${openFaqIndex === index ? 'rotated' : ''}`}>
                                                        ⌄
                                                    </span>
                                                </div>
                                                <div className={`faq-answer ${openFaqIndex === index ? 'open' : ''}`}>
                                                    <p className="text-secondary whitespace-pre-line leading-relaxed">
                                                        {faq.answer}
                                                    </p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div>
                                        <h3 className="text-2xl font-bold text-primary mb-6">💡 أمثلة عملية</h3>
                                        {examplePrompts.map((example, index) => (
                                            <div key={index} className="example-block input-bg mb-4">
                                                <button
                                                    onClick={() => copyToClipboard(example.prompt)}
                                                    className="copy-example-btn gradient-btn"
                                                >
                                                    <i className="fas fa-copy"></i> نسخ
                                                </button>
                                                <h4 className="font-bold text-primary mb-2 text-lg">{example.title}</h4>
                                                <p className="text-secondary mb-2 text-sm">
                                                    <span className="category-badge" style={{background: 'rgba(0, 212, 170, 0.2)', color: '#00d4aa'}}>
                                                        {example.category}
                                                    </span>
                                                </p>
                                                <p className="text-primary leading-relaxed">{example.prompt}</p>
                                                <button
                                                    onClick={() => {
                                                        setBasicPrompt(example.prompt);
                                                        setActiveTab('generator');
                                                    }}
                                                    className="mt-3 px-4 py-2 rounded-xl text-sm"
                                                    style={{border: '2px solid #00d4aa', color: '#00d4aa'}}
                                                >
                                                    ✨ استخدم هذا المثال
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {/* Popular Prompts Tab */}
                        {activeTab === 'popular' && (
                            <div className="animate-fade-in">
                                <div className="card-bg p-8 rounded-3xl">
                                    <h2 className="text-3xl font-bold text-primary mb-4">🔥 البرومبتات الأكثر شعبية</h2>
                                    <p className="text-secondary mb-8">البرومبتات الأعلى تقييماً واستخداماً من المجتمع</p>
                                    
                                    <div className="overflow-x-auto">
                                        <table className="popular-table">
                                            <tbody>
                                                {popularPrompts.map((item, index) => (
                                                    <tr 
                                                        key={index} 
                                                        className="popular-row"
                                                        onClick={() => usePopularPrompt(item.prompt)}
                                                    >
                                                        <td className="input-bg" style={{width: '80px'}}>
                                                            <div className={`rank-badge ${
                                                                item.rank === 1 ? 'rank-1' :
                                                                item.rank === 2 ? 'rank-2' :
                                                                item.rank === 3 ? 'rank-3' :
                                                                'rank-other'
                                                            }`}>
                                                                {item.rank === 1 ? '🥇' :
                                                                 item.rank === 2 ? '🥈' :
                                                                 item.rank === 3 ? '🥉' :
                                                                 item.rank}
                                                            </div>
                                                        </td>
                                                        <td className="input-bg" style={{width: '100%'}}>
                                                            <div className="flex flex-col gap-2">
                                                                <p className="text-primary font-bold">{item.prompt}</p>
                                                                <div className="flex gap-3 items-center flex-wrap">
                                                                    <span className="category-badge text-xs" style={{background: 'rgba(0, 212, 170, 0.2)', color: '#00d4aa'}}>
                                                                        {item.category}
                                                                    </span>
                                                                    <span className="text-secondary text-xs">
                                                                        👥 {item.uses.toLocaleString()} استخدام
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td className="input-bg" style={{width: '150px', textAlign: 'center'}}>
                                                            <div className="star-rating">
                                                                {[...Array(5)].map((_, i) => (
                                                                    <span key={i} className={i < item.rating ? '' : 'star-empty'}>
                                                                        ★
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>

                                    <div className="text-center mt-8">
                                        <p className="text-secondary text-sm">
                                            💡 اضغط على أي برومبت لاستخدامه مباشرة في المولد
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Stats Tab */}
                        {activeTab === 'stats' && (
                            <div className="animate-fade-in">
                                <div className="card-bg p-8 rounded-3xl">
                                    <h2 className="text-2xl font-bold text-primary mb-6">📈 إحصائياتك</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="stat-card input-bg">
                                            <div className="text-4xl mb-2">📊</div>
                                            <div className="stat-number gradient-text">{stats.totalGenerated}</div>
                                            <p className="text-secondary text-sm">إجمالي البرومبتات</p>
                                        </div>
                                        <div className="stat-card input-bg">
                                            <div className="text-4xl mb-2">🔥</div>
                                            <div className="stat-number gradient-text">{stats.todayGenerated}</div>
                                            <p className="text-secondary text-sm">اليوم</p>
                                        </div>
                                        <div className="stat-card input-bg">
                                            <div className="text-4xl mb-2">⭐</div>
                                            <div className="text-lg font-bold text-primary">{stats.favoriteCategory}</div>
                                            <p className="text-secondary text-sm">الفئة الأكثر استخداماً</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Share Modal */}
                    {showShareModal && (
                        <div className="modal-overlay" onClick={() => setShowShareModal(false)}>
                            <div className="modal-content card-bg p-8" onClick={(e) => e.stopPropagation()}>
                                <h2 className="text-2xl font-bold text-primary mb-4">{t.shareTitle}</h2>
                                <p className="text-secondary mb-6">{t.shareDescription}</p>
                                
                                <div className="grid gap-4">
                                    <div
                                        onClick={shareToTwitter}
                                        className="share-option input-bg flex items-center gap-4"
                                    >
                                        <div className="text-3xl">🐦</div>
                                        <div>
                                            <h3 className="font-bold text-primary">شارك على تويتر</h3>
                                            <p className="text-xs text-secondary">انشر مع متابعينك</p>
                                        </div>
                                    </div>

                                    <div
                                        onClick={shareToTelegram}
                                        className="share-option input-bg flex items-center gap-4"
                                    >
                                        <div className="text-3xl">✈️</div>
                                        <div>
                                            <h3 className="font-bold text-primary">شارك على تليجرام</h3>
                                            <p className="text-xs text-secondary">أرسل للأصدقاء</p>
                                        </div>
                                    </div>

                                    <div
                                        onClick={copyShareLink}
                                        className="share-option input-bg flex items-center gap-4"
                                    >
                                        <div className="text-3xl">🔗</div>
                                        <div>
                                            <h3 className="font-bold text-primary">نسخ الرابط</h3>
                                            <p className="text-xs text-secondary">شارك في أي مكان</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Library Prompt Modal */}
                    {selectedPrompt && (
                        <div className="modal-overlay" onClick={() => setSelectedPrompt(null)}>
                            <div className="modal-content card-bg p-6" onClick={(e) => e.stopPropagation()}>
                                <h2 className="text-xl font-bold text-primary mb-4">{selectedPrompt.title}</h2>
                                <div className="input-bg p-4 rounded-xl mb-4" style={{maxHeight: '300px', overflowY: 'auto'}}>
                                    <pre className="text-primary whitespace-pre-wrap text-xs">{selectedPrompt.fullPrompt}</pre>
                                </div>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => copyToClipboard(selectedPrompt.fullPrompt)}
                                        className="flex-1 gradient-btn py-2 rounded-lg"
                                    >
                                        <i className="fas fa-copy"></i>
                                    </button>
                                    <button
                                        onClick={() => {
                                            setBasicPrompt(selectedPrompt.fullPrompt);
                                            setSelectedPrompt(null);
                                            setActiveTab('generator');
                                        }}
                                        className="flex-1 py-2 rounded-lg"
                                        style={{border: '2px solid #00d4aa', color: '#00d4aa'}}
                                    >
                                        {t.useThisPrompt}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="header-bg py-6 mt-12">
                        <div className="container mx-auto px-4 text-center">
                            <div className="flex justify-center gap-4 mb-4">
                                <a
                                    href="https://t.me/dr_basl"
                                    target="_blank"
                                    className="px-4 py-2 rounded-full text-sm"
                                    style={{background: '#0088cc', color: 'white'}}
                                >
                                    <i className="fab fa-telegram"></i> تليجرام
                                </a>
                                <a
                                    href="https://x.com/hzbr_al"
                                    target="_blank"
                                    className="px-4 py-2 rounded-full text-sm"
                                    style={{background: '#000', color: 'white'}}
                                >
                                    <i className="fab fa-x-twitter"></i> تويتر
                                </a>
                            </div>
                            <p className="text-xs text-secondary">رقيم AI 966 © 2025 | الذكاء الاصطناعي السعودي</p>
                            <p className="text-xs text-secondary mt-2" style={{color: '#00d4aa'}}>⚡ يعمل محلياً بدون إنترنت - قوالب احترافية ذكية</p>
                        </div>
                    </footer>
                </div>
            );
        }

        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', function() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                icon.textContent = '☀️';
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                icon.textContent = '🌙';
            }
        });

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
